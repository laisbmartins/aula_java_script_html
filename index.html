<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div>
      <h1 id="resultadoAluno"></h1>
    </div>
    <script>
      // = recebendo um valor
      // === compara tipo e valor
      // == compara valor
      // != valor diferente
      // !== valor e tipo diferente
      // > maior
      // < menor
      // >= maior ou igual
      // <= menor ou igual

      let alunoAprovado = false;
      let elementoResultadoAluno = document.getElementById("resultadoAluno");

      if (alunoAprovado) {
        elementoResultadoAluno.textContent = "Aluno aprovado";
        elementoResultadoAluno.style.color = "green";
      } else {
        elementoResultadoAluno.textContent = "Aluno reprovado";
        elementoResultadoAluno.style.color = "red";
      }
    </script>
  </body>
</html>
